# Single source of truth for the pain vocabulary (157 terms).
# Loaded by src/cp_multiomics/vocabulary.py. As of Stage 0 it drives SCREENING
# (pipeline/02_screen.py) and the proteomics scorer (scripts/analyze_proteomics.py).
# Retrieval (pipeline/03_ingest_omics.py, pipeline/01_search_literature.py) still uses
# the original 4-term query; wiring retrieval to this vocabulary is a Stage 1 task
# (see plan/cohort_expansion_plan.md).
# Previously this list lived in scripts/analyze_proteomics.py and was applied
# only AFTER retrieval, so the recall damage was already done.

# The four terms the original ingestion query used. Everything else was missing.
core:
  - chronic pain
  - neuropathic pain
  - inflammatory pain
  - nociplastic pain

