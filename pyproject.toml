[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cp-multiomics"
version = "1.0.0"
description = "Multi-omics meta-study on chronic pain (human & animal models)"
authors = [{ name = "Antonio G. Zippo", email = "antonio.zippo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "requests>=2.32",
    "biopython>=1.84",
    "anndata>=0.10",
    "scanpy>=1.10",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "tqdm>=4.66",
    "openpyxl>=3.1.5",
    "h5py>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cp_multiomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
